<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1147"/>
      <stop offset="0.6" stop-color="#140c2e"/>
      <stop offset="1" stop-color="#0b0718"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d5dfc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff7ab6"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ad7ff"/>
      <stop offset="1" stop-color="#6d5dfc"/>
    </linearGradient>
    <linearGradient id="sky3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9dffb0"/>
      <stop offset="1" stop-color="#2bb3a0"/>
    </linearGradient>
    <clipPath id="win"><rect x="600" y="96" width="600" height="448" rx="14"/></clipPath>
    <clipPath id="photo"><rect x="740" y="210" width="320" height="220" rx="10"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="900" cy="320" r="420" fill="url(#halo)"/>

  <!-- Text column. -->
  <image x="80" y="150" width="96" height="96" xlink:href="icon.svg"/>
  <text x="80" y="320" fill="#ffffff" font-size="50" font-weight="700" letter-spacing="-1">Lightbox for GitHub</text>
  <text x="80" y="372" fill="#d9d3ff" font-size="26">See GitHub images and videos</text>
  <text x="80" y="406" fill="#d9d3ff" font-size="26">up close, without leaving the page.</text>
  <g font-size="19" fill="#b3a9f0">
    <text x="80" y="470">Click to zoom  ·  Arrow keys to step  ·  Esc to close</text>
  </g>
  <g transform="translate(80 500)">
    <rect width="206" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="103" y="26" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Chrome extension</text>
  </g>

  <!-- Browser window. -->
  <g filter="url(#shadow)">
    <rect x="600" y="96" width="600" height="448" rx="14" fill="#0d1117"/>
  </g>
  <g clip-path="url(#win)">
    <rect x="600" y="96" width="600" height="36" fill="#161b22"/>
    <circle cx="622" cy="114" r="6" fill="#ff5f57"/>
    <circle cx="642" cy="114" r="6" fill="#febc2e"/>
    <circle cx="662" cy="114" r="6" fill="#28c840"/>
    <rect x="700" y="104" width="400" height="20" rx="10" fill="#0d1117"/>
    <text x="900" y="119" text-anchor="middle" fill="#7d8590" font-size="12">github.com/acme/widgets/pull/7</text>

    <!-- The issue page under the lightbox. -->
    <g fill="#30363d">
      <rect x="630" y="156" width="260" height="16" rx="4"/>
      <rect x="630" y="196" width="540" height="300" rx="8" fill="none" stroke="#30363d" stroke-width="2"/>
      <rect x="650" y="216" width="380" height="10" rx="4"/>
      <rect x="650" y="236" width="300" height="10" rx="4"/>
      <rect x="650" y="266" width="200" height="130" rx="6" fill="url(#sky)"/>
      <rect x="650" y="416" width="420" height="10" rx="4"/>
      <rect x="650" y="436" width="340" height="10" rx="4"/>
    </g>

    <!-- The lightbox. -->
    <rect x="600" y="132" width="600" height="412" fill="#05030c" fill-opacity="0.82"/>
    <text x="616" y="158" fill="#ffffff" fill-opacity="0.8" font-size="12">2 / 4</text>
    <circle cx="1176" cy="154" r="14" fill="#ffffff" fill-opacity="0.12"/>
    <path d="M1171 149 L1181 159 M1181 149 L1171 159" stroke="#fff" stroke-width="2" stroke-linecap="round"/>

    <g clip-path="url(#photo)">
      <rect x="740" y="210" width="320" height="220" fill="url(#sky)"/>
      <circle cx="1000" cy="260" r="24" fill="#fff8e6"/>
      <path d="M740 430 L840 320 L900 380 L940 340 L1060 430 Z" fill="#2a1a63"/>
      <path d="M740 430 L800 370 L860 430 Z" fill="#3d2a85"/>
    </g>

    <g fill="#ffffff" fill-opacity="0.12">
      <circle cx="706" cy="320" r="18"/>
      <circle cx="1094" cy="320" r="18"/>
    </g>
    <g fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M709 312 L701 320 L709 328"/>
      <path d="M1091 312 L1099 320 L1091 328"/>
    </g>

    <text x="900" y="458" text-anchor="middle" fill="#ffffff" font-size="13">New settings page, dark mode</text>
    <g>
      <rect x="826" y="476" width="34" height="34" rx="5" fill="url(#sky2)" opacity="0.5"/>
      <rect x="866" y="476" width="34" height="34" rx="5" fill="url(#sky)"/>
      <rect x="866" y="476" width="34" height="34" rx="5" fill="none" stroke="#fff" stroke-width="2"/>
      <rect x="906" y="476" width="34" height="34" rx="5" fill="url(#sky3)" opacity="0.5"/>
      <rect x="946" y="476" width="34" height="34" rx="5" fill="#ff7ab6" opacity="0.5"/>
    </g>
  </g>
</svg>
