name: Publish to Chrome Web Store

# The Release workflow calls this after it creates a GitHub release.
# Run it by hand to publish a release again, for example after a review blocked the first try.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to publish, such as 0.3.0. Its GitHub release must hold the zip.'
        required: true
        type: string

permissions: {}

# The store takes one submission at a time.
concurrency: chrome-web-store

jobs:
  publish:
    # A fork, or this repository before the store setup, has no publisher ID. It skips the job.
    if: vars.CWS_PUBLISHER_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Google exchanges the GitHub OIDC token for a short-lived token of the publisher service account.
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version
        run: '[[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]] || { echo "\"$VERSION\" is not a Chrome extension version"; exit 1; }'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the Node version that mise.toml pins. The publish script needs Node only.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8

      # The store gets the same zip that the GitHub release holds.
      - name: Download the zip from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$VERSION" --pattern "gh-lightbox-v$VERSION.zip" --dir "$RUNNER_TEMP"

      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          # The step needs only the token output. No credentials file goes into the workspace.
          create_credentials_file: false
          export_environment_variables: false

      - name: Upload and submit for review
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
        run: node scripts/publish-store.ts "$RUNNER_TEMP/gh-lightbox-v$VERSION.zip" "$VERSION"
