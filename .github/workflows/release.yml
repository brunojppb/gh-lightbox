name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `changeset git-tag` checks local tags only, so it needs every existing tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # With changesets on main: open or update the version pull request.
      # Without: tag the current version if it has no tag, then create its GitHub release from CHANGELOG.md.
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
      - name: Attach the extension zip to the release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.changesets.outputs.published-packages }}
        run: |
          version=$(jq -r '.[0].version' <<<"$PUBLISHED")
          zip_file="$RUNNER_TEMP/gh-lightbox-v$version.zip"
          (cd extension && zip -r "$zip_file" .)
          gh release upload "v$version" "$zip_file" --clobber
